<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>珠算练习 · 移动版</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
        html, body { height: 100%; font-family: 'Times New Roman', 'Hiragino Mincho ProN', 'Yu Mincho', serif; background: #f2f2f2; touch-action: manipulation; }
        .app { display: flex; flex-direction: column; width: 100%; min-height: 100dvh; background: #ffffff; padding: 12px 18px; border: 1px solid #ccc; margin: 0 auto; max-width: 960px; }
        .status-bar { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid #aaa; margin-bottom: 14px; font-size: 16px; color: #000; flex-shrink: 0; }
        .status-bar .progress { font-weight: 600; }
        .status-bar .score { font-weight: 600; color: #1a7a3a; }
        .question-card { background: #fff; border: 1px solid #aaa; padding: 14px 16px 10px; margin-bottom: 14px; flex: 1 1 auto; min-height: 150px; display: flex; flex-direction: column; }
        #questionBody { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; }
        .question-body { text-align: center; font-size: clamp(20px, 5vw, 32px); line-height: 1.8; font-family: 'Times New Roman', 'Courier New', monospace; padding: 8px 0; }
        /* 見取算：横屏时按五口一列排成左右两栏 */
        .question-body.vertical { display: grid; grid-template-columns: repeat(2, minmax(120px, 1fr)); gap: clamp(24px, 8vw, 96px); width: min(100%, 620px); margin: 0 auto; text-align: right; line-height: 1.2; }
        .question-body.vertical .term-column { min-width: 0; }
        .question-body.vertical .term { display: flex; justify-content: flex-end; gap: 4px; }
        .question-body.vertical .term .sign { min-width: 18px; text-align: right; padding-right: .3em; }
        .question-body.vertical .term .num { font-variant-numeric: tabular-nums; min-width: 70px; text-align: right; }
        .question-body.vertical .line { border-bottom: 2px solid #000; width: 100%; max-width: 160px; margin: 4px 0 4px auto; }
        .question-body.inline { text-align: center; font-size: clamp(22px, 5.5vw, 34px); padding: 8px 0; }
        .currency { font-weight: 700; margin-right: 0.2em; }
        /* 答案显示位于数字键盘抽屉内 */
        .feedback { text-align: center; font-size: clamp(20px, 5vw, 32px); font-weight: 600; min-height: 40px; padding: 5px 8px; font-family: 'Times New Roman', 'Courier New', monospace; }
        .feedback.correct { color: #1a7a3a; }
        .feedback.wrong { color: #b33c2a; }
        .numpad { position: fixed; z-index: 20; bottom: 0; left: 50%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: min(100%, 420px); padding: 12px 12px max(12px, env(safe-area-inset-bottom)); background: #f8f6f2; border: 1px solid #aaa; border-bottom: 0; box-shadow: 0 -6px 20px rgba(0, 0, 0, .16); transform: translate(-50%, 100%); transition: transform .24s ease; }
        .numpad.open { transform: translate(-50%, 0); }
        .numpad-toggle { position: absolute; top: -42px; left: 50%; transform: translateX(-50%); height: 42px; min-width: 150px; padding: 0 18px; background: #1a7a3a; border: 1px solid #1a7a3a; border-bottom: 0; border-radius: 8px 8px 0 0; color: #fff; font: 600 16px 'Times New Roman', serif; cursor: pointer; touch-action: manipulation; }
        .numpad-toggle[aria-expanded="true"] { background: #155f30; }
        .numpad button:not(.numpad-toggle) { background: #ffffff; border: 1px solid #aaa; font-size: clamp(20px, 3.5vw, 30px); font-family: 'Times New Roman', serif; font-weight: 500; color: #1e1e1e; transition: 0.06s; touch-action: manipulation; cursor: pointer; display: flex; align-items: center; justify-content: center; min-height: 42px; padding: 4px 0; box-shadow: none; }
        .numpad button:not(.numpad-toggle):active { background: #ddd8d0; transform: scale(0.96); }
        .numpad .btn-clear { background: #e8e0d6; font-size: clamp(18px, 4vw, 24px); }
        .numpad .btn-enter { background: #1a7a3a; color: #fff; border-color: #1a7a3a; }
        .numpad .btn-enter:active { background: #0f5e2b; }
        .numpad .btn-back { background: #e8e0d6; }
        .numpad .btn-neg { background: #e8e0d6; }
        .numpad .btn-dot { background: #e8e0d6; font-weight: 600; }
        .numpad .feedback { grid-column: 1 / -1; background: #fff; border: 1px solid #aaa; margin: 0 0 2px; }
        .part-nav, .question-nav { display: flex; align-items: center; gap: 4px; }
        .part-nav button, .question-nav button { height: 30px; min-width: 30px; background: #fff; border: 1px solid #555; border-radius: 4px; padding: 0 7px; font: 600 16px 'Times New Roman', serif; cursor: pointer; touch-action: manipulation; color: #000; }
        .part-nav .btn-part.active { background: #000; color: #fff; border-color: #000; }
        .question-nav { justify-content: center; min-width: 0; }
        .question-nav .progress { min-width: 58px; text-align: center; white-space: nowrap; }
        .question-nav button { font-size: 22px; line-height: 1; }
        .question-nav button:disabled { opacity: .35; }
        .settings-toggle { position: fixed; z-index: 16; left: max(10px, env(safe-area-inset-left)); bottom: max(10px, env(safe-area-inset-bottom)); width: 42px; height: 42px; background: #fff; border: 1px solid #555; border-radius: 50%; font-size: 20px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
        .settings-panel { position: fixed; z-index: 17; left: max(10px, env(safe-area-inset-left)); bottom: max(60px, calc(env(safe-area-inset-bottom) + 50px)); display: grid; gap: 8px; width: min(240px, calc(100vw - 20px)); padding: 12px; background: #fff; border: 1px solid #777; box-shadow: 0 4px 16px rgba(0,0,0,.2); }
        .settings-panel[hidden] { display: none; }
        .settings-panel label { font-size: 14px; }
        .settings-panel select { background: #fff; border: 1px solid #555; padding: 5px 8px; font: 16px 'Times New Roman', serif; outline: none; }
        .settings-panel .btn-reset { background: #000; color: #fff; border: 1px solid #000; padding: 6px 12px; font: 600 15px 'Times New Roman', serif; cursor: pointer; }
        .toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #fff; padding: 6px 20px; font-size: 16px; font-weight: 600; pointer-events: none; opacity: 0; transition: opacity 0.25s; z-index: 100; border: 1px solid #333; font-family: 'Times New Roman', serif; }
        .toast.show { opacity: 1; }
        @media (orientation: landscape) { .app { max-width: none; height: 100dvh; min-height: 0; padding: 8px 22px; } .status-bar { margin-bottom: 8px; padding-bottom: 6px; } .question-card { min-height: 0; margin-bottom: 8px; padding: 8px 16px; } .question-body { padding: 3px 0; } .feedback { min-height: 30px; padding-top: 3px; } .numpad { width: min(48vw, 420px); } .numpad button:not(.numpad-toggle) { min-height: 36px; } }
        @media (max-width: 380px) { .app { padding: 10px 8px; } .question-body { font-size: 18px; } .feedback { font-size: 18px; } .question-body.vertical { gap: 14px; } }
    </style>
</head>
<body>

<div class="app" id="app">
    <div class="status-bar">
        <div class="part-nav" aria-label="分区跳转">
            <button class="btn-part" data-part="0" type="button">A</button>
            <button class="btn-part" data-part="1" type="button">B</button>
            <button class="btn-part" data-part="2" type="button">C</button>
        </div>
        <div class="question-nav" aria-label="题目导航">
            <button id="prevBtn" type="button" aria-label="上一题" title="上一题">‹</button>
            <span class="progress" id="progressDisplay">1 / 10</span>
            <button id="nextBtn" type="button" aria-label="下一题" title="下一题">›</button>
        </div>
        <span class="score" id="scoreDisplay">✅ 0</span>
    </div>
    <div class="question-card" id="questionCard">
        <div class="question-body" id="questionBody"></div>
    </div>
    <div class="numpad" id="numpad">
        <button class="numpad-toggle" id="numpadToggle" type="button" aria-expanded="false" aria-controls="numpad">⌨ 输入答案</button>
        <div class="feedback" id="feedback" aria-live="polite"></div>
        <button data-value="7">7</button>
        <button data-value="8">8</button>
        <button data-value="9">9</button>
        <button data-value="4">4</button>
        <button data-value="5">5</button>
        <button data-value="6">6</button>
        <button data-value="1">1</button>
        <button data-value="2">2</button>
        <button data-value="3">3</button>
        <button class="btn-clear" data-value="clear">C</button>
        <button data-value="0">0</button>
        <button class="btn-back" data-value="back">⌫</button>
        <button class="btn-neg" data-value="neg">−</button>
        <button class="btn-dot" data-value=".">.</button>
        <button class="btn-enter" data-value="enter">⏎</button>
    </div>
    <button class="settings-toggle" id="settingsToggle" type="button" aria-label="设置" aria-expanded="false" aria-controls="settingsPanel">⚙</button>
    <div class="settings-panel" id="settingsPanel" hidden>
        <label for="levelSelect">珠算等级</label>
        <select id="levelSelect">
            <option value="1">1 級</option>
            <option value="2">2 級</option>
            <option value="3" selected>3 級</option>
            <option value="4">4 級</option>
            <option value="5">5 級</option>
            <option value="6">6 級</option>
        </select>
        <button class="btn-reset" id="resetBtn">↻ やり直し</button>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function() {
    'use strict';

    // ----- 级别配置 -----
    const LEVEL_CONFIG = {
        1: { mitorizan: { digits: 10, terms: 10, count: 10 }, multiplication: { totalDigits: 11, count: 20 }, division: { totalDigits: 10, count: 20 } },
        2: { mitorizan: { digits: 8, terms: 10, count: 10 }, multiplication: { totalDigits: 9, count: 20 }, division: { totalDigits: 8, count: 20 } },
        3: { mitorizan: { digits: 6, terms: 10, count: 10 }, multiplication: { totalDigits: 7, count: 20 }, division: { totalDigits: 6, count: 20 } },
        4: { mitorizan: { digits: 5, terms: 10, count: 10 }, multiplication: { totalDigits: 7, count: 20 }, division: { totalDigits: 6, count: 20 } },
        5: { mitorizan: { digits: 4, terms: 10, count: 10 }, multiplication: { totalDigits: 6, count: 20 }, division: { totalDigits: 5, count: 20 } },
        6: { mitorizan: { digits: 3, terms: 10, count: 10 }, multiplication: { totalDigits: 5, count: 20 }, division: { totalDigits: 4, count: 20 } }
    };

    // ----- 核心工具函数 -----
    function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    function randomInt(digits) {
        if (digits === 1) return rand(1, 9);
        let first = rand(1, 9), rest = '';
        for (let i = 1; i < digits; i++) rest += rand(0, 9);
        return parseInt(first + rest, 10);
    }

    function randomIntWithLastNonZero(digits) {
        if (digits === 1) return rand(1, 9);
        let first = rand(1, 9), rest = '';
        for (let i = 1; i < digits - 1; i++) rest += rand(0, 9);
        let last = rand(1, 9);
        return parseInt(first + rest + last, 10);
    }

    // 四舍五入：isNamed=true → 整数，false → 保留三位小数
    function roundAnswer(value, isNamed) {
        if (isNamed) {
            return Math.round(value);
        } else {
            return Math.round(value * 1000) / 1000;
        }
    }

    // 为整数部分添加千位分隔符（支持负数）
    function addCommasToInteger(integerStr) {
        let negative = false;
        if (integerStr.startsWith('-')) {
            negative = true;
            integerStr = integerStr.slice(1);
        }
        let result = integerStr.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        return negative ? '-' + result : result;
    }

    // 格式化数字显示（按名数/无名数），带千位分隔符
    function formatNumber(num, isNamed) {
        if (num === undefined || num === null || isNaN(num)) return '';
        let rounded = roundAnswer(num, isNamed);
        if (isNamed) {
            return rounded.toLocaleString('en-US');
        } else {
            let str = rounded.toFixed(3).replace(/\.?0+$/, '');
            if (str === '-0') str = '0';
            let parts = str.split('.');
            let intPart = parts[0];
            let decPart = parts[1] || '';
            let formattedInt = addCommasToInteger(intPart);
            return decPart ? formattedInt + '.' + decPart : formattedInt;
        }
    }

    // 将整数和缩放因子转换为显示字符串（精确小数），带千位分隔符
    function formatScaledNumber(intPart, scale) {
        if (scale === 0) {
            return addCommasToInteger(intPart.toString());
        }
        let str = intPart.toString();
        if (str.length <= scale) {
            str = str.padStart(scale + 1, '0');
        }
        let intLen = str.length - scale;
        let integerPart = str.slice(0, intLen);
        let decimalPart = str.slice(intLen);
        decimalPart = decimalPart.replace(/0+$/, '');
        let formattedInt = addCommasToInteger(integerPart);
        if (decimalPart === '') return formattedInt;
        return formattedInt + '.' + decimalPart;
    }

    // ----- 見取算（全名数）-----
    function generateMitorizan(level, type) {
        const cfg = LEVEL_CONFIG[level];
        const digits = cfg.mitorizan.digits;
        const terms = cfg.mitorizan.terms;
        let numbers = [];
        let total = 0;

        if (type === 0) {
            for (let i = 0; i < terms; i++) {
                let num = randomInt(digits);
                numbers.push(num);
                total += num;
            }
            if (total <= 0) return generateMitorizan(level, type);
        } else {
            let subCount = rand(3, Math.min(5, terms - 1));
            let indices = [];
            for (let i = 1; i < terms; i++) indices.push(i);
            for (let i = indices.length - 1; i > 0; i--) {
                const j = rand(0, i);
                [indices[i], indices[j]] = [indices[j], indices[i]];
            }
            let subPositions = indices.slice(0, subCount);
            let posNums = [];
            for (let i = 0; i < terms; i++) posNums.push(randomInt(digits));

            if (type === 1) {
                let cum = 0, ok = true;
                for (let i = 0; i < terms; i++) {
                    let val = posNums[i];
                    if (subPositions.includes(i)) {
                        if (cum <= val) { ok = false; break; }
                        cum -= val;
                    } else cum += val;
                }
                if (!ok || cum <= 0) return generateMitorizan(level, type);
                numbers = posNums.map((v, i) => subPositions.includes(i) ? -v : v);
                total = cum;
            } else {
                let cum = 0, found = false;
                for (let i = 0; i < terms; i++) {
                    let val = posNums[i];
                    if (subPositions.includes(i)) {
                        if (cum < val) found = true;
                        cum -= val;
                    } else cum += val;
                }
                if (!found || cum <= 0) return generateMitorizan(level, type);
                numbers = posNums.map((v, i) => subPositions.includes(i) ? -v : v);
                total = cum;
            }
        }

        const isNamed = true;
        const answer = roundAnswer(total, isNamed);

        let termsArr = [];
        for (let i = 0; i < numbers.length; i++) {
            let val = numbers[i];
            let sign = (i === 0) ? '' : (val < 0 ? '−' : '');
            let absVal = Math.abs(val);
            let formatted = formatNumber(absVal, false);
            termsArr.push({ sign: sign, num: formatted });
        }
        return {
            type: 'mitorizan',
            typeLabel: '見取算',
            terms: termsArr,
            answer: answer,
            isNamed: isNamed,
            expressionText: termsArr.map(t => (t.sign ? t.sign + ' ' : '') + t.num).join(' ')
        };
    }

    // ----- 乗算（整数生成 + 缩放）-----
    function generateMultiplication(level, isNamed) {
        const cfg = LEVEL_CONFIG[level];
        const totalDigits = cfg.multiplication.totalDigits;
        let digitsA = Math.floor(totalDigits / 2);
        let digitsB = totalDigits - digitsA;
        if (Math.abs(digitsA - digitsB) > 1) {
            if (digitsA > digitsB) { digitsA--; digitsB++; }
            else { digitsA++; digitsB--; }
        }

        const isInteger = Math.random() < 0.5;
        let aInt, bInt, scaleA, scaleB;
        if (isInteger) {
            aInt = randomInt(digitsA);
            bInt = randomInt(digitsB);
            scaleA = 0;
            scaleB = 0;
        } else {
            aInt = randomIntWithLastNonZero(digitsA);
            bInt = randomIntWithLastNonZero(digitsB);
            scaleA = rand(1, digitsA - 1);
            scaleB = rand(1, digitsB - 1);
        }

        let a = aInt / Math.pow(10, scaleA);
        let b = bInt / Math.pow(10, scaleB);
        let product = (aInt * bInt) / Math.pow(10, scaleA + scaleB);
        let answer = roundAnswer(product, isNamed);

        let aStr = formatScaledNumber(aInt, scaleA);
        let bStr = formatScaledNumber(bInt, scaleB);
        return {
            type: 'multiplication',
            typeLabel: '乗算',
            expressionText: aStr + ' × ' + bStr,
            answer: answer,
            isNamed: isNamed
        };
    }

    // ----- 除算（四舍五入题不再强制除不尽）-----
    function generateDivision(level, isNamed, needRound) {
        const cfg = LEVEL_CONFIG[level];
        const totalDigits = cfg.division.totalDigits;
        let digitsDivisor = Math.floor(totalDigits / 2);
        let digitsQuotient = totalDigits - digitsDivisor;
        if (Math.abs(digitsDivisor - digitsQuotient) > 1) {
            if (digitsDivisor > digitsQuotient) { digitsDivisor--; digitsQuotient++; }
            else { digitsDivisor++; digitsQuotient--; }
        }

        if (!needRound) {
            // ---- 除尽题 ----
            const isInteger = Math.random() < 0.5;
            let divisorInt, quotientInt, scaleDiv, scaleQ;
            if (isInteger) {
                divisorInt = randomInt(digitsDivisor);
                quotientInt = randomInt(digitsQuotient);
                scaleDiv = 0;
                scaleQ = 0;
            } else {
                if (Math.random() < 0.5) {
                    divisorInt = randomIntWithLastNonZero(digitsDivisor);
                    scaleDiv = rand(1, digitsDivisor - 1);
                    quotientInt = randomInt(digitsQuotient);
                    scaleQ = 0;
                } else {
                    divisorInt = randomInt(digitsDivisor);
                    quotientInt = randomIntWithLastNonZero(digitsQuotient);
                    scaleDiv = 0;
                    scaleQ = rand(1, digitsQuotient - 1);
                }
            }
            let divisor = divisorInt / Math.pow(10, scaleDiv);
            let quotient = quotientInt / Math.pow(10, scaleQ);
            let dividend = divisor * quotient;
            let dividendStr = formatNumber(dividend, false);
            let divisorStr = formatScaledNumber(divisorInt, scaleDiv);
            let quotientStr = formatScaledNumber(quotientInt, scaleQ);
            let answer = roundAnswer(quotient, isNamed);
            return {
                type: 'division',
                typeLabel: '除算',
                expressionText: dividendStr + ' ÷ ' + divisorStr,
                answer: answer,
                isNamed: isNamed
            };
        } else {
            // ---- 四舍五入题（简单整数相除）----
            let divisorInt = randomInt(digitsDivisor);
            let dividendDigits = digitsDivisor + digitsQuotient;
            let dividendInt = randomInt(dividendDigits);
            let q = dividendInt / divisorInt;
            let answer = roundAnswer(q, isNamed);
            let dividendStr = formatNumber(dividendInt, false);
            let divisorStr = formatNumber(divisorInt, false);
            return {
                type: 'division',
                typeLabel: '除算',
                expressionText: dividendStr + ' ÷ ' + divisorStr,
                answer: answer,
                isNamed: isNamed
            };
        }
    }

    // ===== 生成完整试卷 =====
    function generateExam(level) {
        let mitorizanQuestions = [];
        for (let i = 0; i < 6; i++) mitorizanQuestions.push(generateMitorizan(level, 0));
        for (let i = 0; i < 3; i++) mitorizanQuestions.push(generateMitorizan(level, 1));
        mitorizanQuestions.push(generateMitorizan(level, 2));
        for (let i = mitorizanQuestions.length - 1; i > 0; i--) {
            const j = rand(0, i);
            [mitorizanQuestions[i], mitorizanQuestions[j]] = [mitorizanQuestions[j], mitorizanQuestions[i]];
        }

        let questions = [];
        questions.push(...mitorizanQuestions);

        // 乗算：前10无名数，后10名数
        for (let i = 0; i < 10; i++) questions.push(generateMultiplication(level, false));
        for (let i = 0; i < 10; i++) questions.push(generateMultiplication(level, true));

        // 除算：前10无名数（8除尽，2四舍五入），后10名数（8除尽，2四舍五入）
        for (let i = 0; i < 8; i++) questions.push(generateDivision(level, false, false));
        for (let i = 0; i < 2; i++) questions.push(generateDivision(level, false, true));
        for (let i = 0; i < 8; i++) questions.push(generateDivision(level, true, false));
        for (let i = 0; i < 2; i++) questions.push(generateDivision(level, true, true));

        return questions.map((q, index) => ({
            ...q,
            id: 'q_' + Date.now() + '_' + index + '_' + Math.random().toString(36).substr(2, 6),
            userAnswer: null,
            isCorrect: null
        }));
    }

    // ----- 移动端控制器 -----
    let allQuestions = [];
    let currentIndex = 0;
    let correctCount = 0;
    let isAnswered = false;
    let inputStr = '';
    let jumpTimer = null;
    let partStart = { A: 0, B: 10, C: 30 };

    const levelSelect = document.getElementById('levelSelect');
    const settingsToggle = document.getElementById('settingsToggle');
    const settingsPanel = document.getElementById('settingsPanel');
    const progressDisplay = document.getElementById('progressDisplay');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const questionBody = document.getElementById('questionBody');
    const feedback = document.getElementById('feedback');
    const numpad = document.getElementById('numpad');
    const numpadToggle = document.getElementById('numpadToggle');
    const toast = document.getElementById('toast');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const partBtns = document.querySelectorAll('.btn-part');

    function displayQuestion(index) {
        if (index >= allQuestions.length) {
            questionBody.innerHTML = '<div style="text-align:center;font-size:20px;padding:20px 0;">🎉 すべて完了！</div>';
            feedback.textContent = '';
            feedback.className = 'feedback';
            isAnswered = true;
            updatePartHighlight(-1);
            return;
        }
        const q = allQuestions[index];
        let bodyHtml = '';
        if (q.type === 'mitorizan') {
            const renderTermColumn = (terms, startIndex) => {
                let termsHtml = '';
                terms.forEach((t, offset) => {
                    const idx = startIndex + offset;
                    const currencyMark = (idx === 0 && q.isNamed) ? '<span class="currency">¥</span> ' : '';
                    termsHtml += `<div class="term">${currencyMark}<span class="sign">${t.sign || ''}</span><span class="num">${t.num}</span></div>`;
                });
                return `<div class="term-column">${termsHtml}<div class="line"></div></div>`;
            };
            bodyHtml = `<div class="question-body vertical">${renderTermColumn(q.terms.slice(0, 5), 0)}${renderTermColumn(q.terms.slice(5, 10), 5)}</div>`;
        } else if (q.type === 'multiplication') {
            let expr = q.expressionText;
            if (q.isNamed) expr = '¥ ' + expr;
            bodyHtml = `<div class="question-body inline">${expr} =</div>`;
        } else {
            let expr = q.expressionText;
            if (q.isNamed) expr = '¥ ' + expr;
            bodyHtml = `<div class="question-body inline">${expr} =</div>`;
        }
        questionBody.innerHTML = bodyHtml;

        if (q.userAnswer !== null && q.userAnswer !== '') {
            let correctDisplay = formatNumber(q.answer, q.isNamed);
            feedback.textContent = q.isCorrect ? '✅ 正解！' : `❌ 誤り (正解: ${correctDisplay})`;
            feedback.className = 'feedback ' + (q.isCorrect ? 'correct' : 'wrong');
            isAnswered = true;
            inputStr = q.userAnswer;
        } else {
            feedback.textContent = '';
            feedback.className = 'feedback';
            isAnswered = false;
            inputStr = '';
        }

        updateProgress();
        updatePartHighlight(index);
        prevBtn.disabled = (index === 0);
        nextBtn.disabled = (index >= allQuestions.length - 1);
    }

    function updateProgress() {
        const part = currentIndex < partStart.B ? { start: partStart.A, end: partStart.B } :
            currentIndex < partStart.C ? { start: partStart.B, end: partStart.C } :
            { start: partStart.C, end: allQuestions.length };
        const questionInPart = Math.min(currentIndex - part.start + 1, part.end - part.start);
        progressDisplay.textContent = `${questionInPart} / ${part.end - part.start}`;
        scoreDisplay.textContent = `✅ ${correctCount}`;
    }

    function updatePartHighlight(index) {
        let part = -1;
        if (index >= 0 && index < partStart.B) part = 0;
        else if (index >= partStart.B && index < partStart.C) part = 1;
        else if (index >= partStart.C && index < allQuestions.length) part = 2;
        partBtns.forEach((btn, i) => {
            btn.classList.toggle('active', i === part);
        });
    }

    function goToIndex(index) {
        if (index < 0) index = 0;
        if (index >= allQuestions.length) index = allQuestions.length - 1;
        if (index === currentIndex) return;
        currentIndex = index;
        displayQuestion(currentIndex);
    }

    function handleInput(value) {
        if (isAnswered) return;
        const q = allQuestions[currentIndex];
        if (!q) return;

        if (value === 'back') {
            inputStr = inputStr.slice(0, -1);
        } else if (value === 'clear') {
            inputStr = '';
        } else if (value === 'neg') {
            if (inputStr.startsWith('-')) {
                inputStr = inputStr.slice(1);
            } else {
                inputStr = '-' + inputStr;
            }
        } else if (value === 'enter') {
            submitAnswer();
            return;
        } else {
            if (inputStr.length > 15) return;
            if (value === '.' && inputStr.includes('.')) return;
            inputStr += value;
        }
        feedback.textContent = inputStr || '␣';
        feedback.className = 'feedback';
    }

    function setNumpadOpen(open) {
        numpad.classList.toggle('open', open);
        numpadToggle.setAttribute('aria-expanded', String(open));
        numpadToggle.textContent = open ? '⌄ 收起输入' : '⌨ 输入答案';
    }

    function setSettingsOpen(open) {
        settingsPanel.hidden = !open;
        settingsToggle.setAttribute('aria-expanded', String(open));
    }

    function submitAnswer() {
        if (isAnswered) return;
        const q = allQuestions[currentIndex];
        if (!q) return;
        if (inputStr === '' || inputStr === '-') {
            showToast('数字を入力してください');
            return;
        }
        const userAns = parseFloat(inputStr);
        if (isNaN(userAns)) {
            showToast('有効な数字を入力してください');
            return;
        }
        const roundedUser = roundAnswer(userAns, q.isNamed);
        const diff = Math.abs(roundedUser - q.answer);
        const correct = diff < 0.001;
        q.userAnswer = inputStr;
        q.isCorrect = correct;
        setNumpadOpen(false);

        if (correct) {
            feedback.textContent = '✅ 正解！';
            feedback.className = 'feedback correct';
            correctCount++;
            isAnswered = true;
            updateProgress();
            clearTimeout(jumpTimer);
            jumpTimer = setTimeout(() => {
                if (currentIndex < allQuestions.length - 1) {
                    goToIndex(currentIndex + 1);
                } else {
                    displayQuestion(allQuestions.length);
                    showToast('🎉 すべて完了！');
                }
            }, 200);
        } else {
            let correctDisplay = formatNumber(q.answer, q.isNamed);
            feedback.textContent = `❌ 誤り (正解: ${correctDisplay})`;
            feedback.className = 'feedback wrong';
            isAnswered = true;
            updateProgress();
            clearTimeout(jumpTimer);
            jumpTimer = setTimeout(() => {
                if (currentIndex < allQuestions.length - 1) {
                    goToIndex(currentIndex + 1);
                } else {
                    displayQuestion(allQuestions.length);
                    showToast('🎉 すべて完了！');
                }
            }, 1200);
        }
    }

    function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toast._timer);
        toast._timer = setTimeout(() => {
            toast.classList.remove('show');
        }, 1500);
    }

    function resetExam() {
        const level = parseInt(levelSelect.value, 10);
        allQuestions = generateExam(level);
        partStart.B = 10;
        partStart.C = 30;
        currentIndex = 0;
        correctCount = 0;
        isAnswered = false;
        inputStr = '';
        clearTimeout(jumpTimer);
        displayQuestion(0);
        updateProgress();
        showToast('新しい問題を生成しました');
    }

    function init() {
        document.querySelectorAll('.numpad button[data-value]').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                const val = this.dataset.value;
                handleInput(val);
            });
            btn.addEventListener('touchstart', function(e) {
                // 阻止双击缩放
            }, { passive: true });
        });

        numpadToggle.addEventListener('click', function() {
            setNumpadOpen(!numpad.classList.contains('open'));
        });

        settingsToggle.addEventListener('click', function() {
            setSettingsOpen(settingsPanel.hidden);
        });

        prevBtn.addEventListener('click', function() {
            if (currentIndex > 0) goToIndex(currentIndex - 1);
        });
        nextBtn.addEventListener('click', function() {
            if (currentIndex < allQuestions.length - 1) goToIndex(currentIndex + 1);
        });

        partBtns.forEach((btn, idx) => {
            btn.addEventListener('click', function() {
                let target = 0;
                if (idx === 0) target = partStart.A;
                else if (idx === 1) target = partStart.B;
                else if (idx === 2) target = partStart.C;
                if (target >= allQuestions.length) target = allQuestions.length - 1;
                if (target < 0) target = 0;
                goToIndex(target);
            });
        });

        levelSelect.addEventListener('change', function() {
            resetExam();
            setSettingsOpen(false);
        });

        document.getElementById('resetBtn').addEventListener('click', function() {
            resetExam();
            setSettingsOpen(false);
        });

        document.addEventListener('focusin', function(e) {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
                e.target.blur();
            }
        });

        resetExam();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }

})();
</script>
</body>
</html>
